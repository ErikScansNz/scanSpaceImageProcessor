name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pico2w-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build git python3 \
            gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Fetch Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk "$HOME/pico-sdk"
          git -C "$HOME/pico-sdk" submodule update --init

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DPICO_BOARD=pico2_w \
            -DPICO_SDK_PATH="$HOME/pico-sdk"

      - name: Build
        run: cmake --build build --verbose

      - name: Size report
        run: arm-none-eabi-size build/pico2w_synth.elf
