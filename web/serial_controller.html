<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pico2W Synth Serial Console</title>
  <style>
    :root {
      --bg0: #11151b;
      --bg1: #1b232d;
      --panel: #202a35;
      --panel-strong: #283443;
      --line: #45617a;
      --ink: #d8e7f4;
      --muted: #8ea6bc;
      --accent: #f3b855;
      --good: #39d18d;
      --warn: #ff6f5c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Rajdhani", "Trebuchet MS", "Segoe UI", sans-serif;
      background:
        radial-gradient(70rem 30rem at -10% 0%, rgba(243, 184, 85, 0.22), transparent 65%),
        radial-gradient(80rem 40rem at 110% 120%, rgba(57, 209, 141, 0.20), transparent 64%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 12px clamp(8px, 1.2vw, 20px);
      display: grid;
      gap: 10px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(32, 42, 53, 0.9);
      backdrop-filter: blur(4px);
    }

    .brand {
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: transform 100ms ease, border-color 100ms ease, background 100ms ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .primary {
      background: linear-gradient(180deg, #d49f45, #bc8731);
      color: #14191f;
      border-color: #cc9842;
    }

    .synth-shell {
      display: grid;
      gap: 10px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(160deg, rgba(32, 42, 53, 0.95), rgba(20, 27, 36, 0.95)),
        radial-gradient(40rem 20rem at 5% -20%, rgba(75, 195, 255, 0.14), transparent 70%),
        radial-gradient(44rem 22rem at 100% 100%, rgba(243, 184, 85, 0.10), transparent 72%);
    }

    .synth-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.018),
        rgba(255, 255, 255, 0.018) 8px,
        transparent 8px,
        transparent 16px
      );
      opacity: 0.35;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(32, 42, 53, 0.94);
      padding: 10px;
    }

    .status-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      position: relative;
      z-index: 1;
    }

    .status-pill {
      border-radius: 999px;
      border: 1px solid var(--line);
      padding: 4px 9px;
      font-weight: 700;
      justify-self: start;
    }

    .ok {
      color: var(--good);
      border-color: rgba(57, 209, 141, 0.45);
      background: rgba(57, 209, 141, 0.08);
    }

    .bad {
      color: var(--warn);
      border-color: rgba(255, 111, 92, 0.45);
      background: rgba(255, 111, 92, 0.08);
    }

    .signal-flow {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: auto minmax(20px, 1fr) auto minmax(20px, 1fr) auto minmax(20px, 1fr) auto minmax(20px, 1fr) auto minmax(20px, 1fr) auto;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(83, 109, 132, 0.65);
      border-radius: 12px;
      background: rgba(14, 20, 29, 0.75);
      padding: 8px 10px;
      margin-bottom: 2px;
    }

    .flow-node {
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(86, 113, 137, 0.8);
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(38, 53, 70, 0.9);
      color: #d8e7f4;
      font-weight: 700;
      white-space: nowrap;
    }

    .flow-node.osc { border-color: rgba(75, 195, 255, 0.7); color: #9be2ff; }
    .flow-node.mix { border-color: rgba(125, 199, 255, 0.6); color: #b7e6ff; }
    .flow-node.filter { border-color: rgba(65, 224, 188, 0.65); color: #8af1d8; }
    .flow-node.amp { border-color: rgba(255, 190, 120, 0.72); color: #ffd8a4; }
    .flow-node.fx { border-color: rgba(245, 124, 168, 0.72); color: #ffc3dd; }
    .flow-node.out { border-color: rgba(199, 226, 110, 0.7); color: #dff3a0; }

    .flow-link {
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(113, 166, 208, 0.25), rgba(113, 166, 208, 0.95), rgba(113, 166, 208, 0.25));
    }

    .panel-sections {
      position: relative;
      z-index: 1;
      display: grid;
      --cluster-width: 360px;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--cluster-width)), var(--cluster-width)));
      grid-auto-flow: row dense;
      justify-content: start;
      align-items: start;
      gap: 10px;
      margin-bottom: 2px;
    }

    .synth-section {
      --section-accent: #8ea6bc;
      grid-column: span 12;
      border: 1px solid rgba(88, 113, 136, 0.74);
      border-radius: 12px;
      background: linear-gradient(155deg, rgba(29, 40, 52, 0.9), rgba(22, 30, 40, 0.92));
      padding: 8px;
      display: grid;
      gap: 8px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .synth-section.section-osc {
      --section-accent: #4bc3ff;
      background: linear-gradient(160deg, rgba(21, 54, 78, 0.48), rgba(16, 33, 46, 0.92));
    }

    .synth-section.section-filter {
      --section-accent: #41e0bc;
      background: linear-gradient(160deg, rgba(17, 70, 58, 0.48), rgba(16, 37, 35, 0.92));
    }

    .synth-section.section-env {
      --section-accent: #f5ca6d;
      background: linear-gradient(160deg, rgba(88, 57, 23, 0.42), rgba(40, 31, 19, 0.92));
    }

    .synth-section.section-lfo {
      --section-accent: #d495ff;
      background: linear-gradient(160deg, rgba(68, 35, 92, 0.45), rgba(35, 26, 48, 0.92));
    }

    .synth-section.section-fx {
      --section-accent: #f57ca8;
      background: linear-gradient(160deg, rgba(88, 26, 48, 0.46), rgba(46, 22, 31, 0.93));
    }

    .synth-section.section-amp {
      --section-accent: #ffbb78;
      background: linear-gradient(160deg, rgba(92, 52, 18, 0.46), rgba(44, 31, 19, 0.93));
    }

    .synth-section.section-system {
      --section-accent: #c7e26e;
      background: linear-gradient(160deg, rgba(58, 79, 20, 0.42), rgba(31, 40, 19, 0.92));
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(117, 143, 168, 0.45);
    }

    .section-title {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 14px;
      color: var(--section-accent);
    }

    .section-subtitle {
      margin: 2px 0 0;
      color: #a9bed1;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .section-mode {
      border: 1px solid rgba(117, 143, 168, 0.55);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #b3cbe0;
      background: rgba(19, 28, 38, 0.75);
      white-space: nowrap;
    }

    .section-chain {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .chain-node {
      border: 1px solid rgba(117, 143, 168, 0.62);
      border-radius: 999px;
      padding: 2px 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 10px;
      color: #d3e6f7;
      background: rgba(17, 26, 35, 0.7);
      text-align: center;
    }

    .chain-link {
      flex: 1;
      min-width: 16px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(151, 177, 203, 0.15), rgba(151, 177, 203, 0.95), rgba(151, 177, 203, 0.15));
    }

    .section-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(174px, 1fr));
      gap: 8px;
    }

    .section-controls.osc-groups {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: start;
    }

    .osc-group {
      border: 1px solid rgba(78, 118, 148, 0.7);
      border-radius: 10px;
      background: linear-gradient(160deg, rgba(31, 47, 63, 0.92), rgba(20, 32, 44, 0.92));
      padding: 8px;
      display: grid;
      gap: 8px;
      min-height: 100%;
    }

    .osc-group.osc1-layout .osc-group-controls {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
    }

    .osc-group.osc1-layout .card.param-osc1_level {
      grid-column: 1 / -1;
    }

    .osc-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(108, 137, 164, 0.45);
      padding-bottom: 4px;
    }

    .osc-group-title {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
      color: #9be2ff;
    }

    .osc-group-meta {
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #9ab2c7;
    }

    .osc-group-controls {
      display: grid;
      gap: 8px;
    }

    .osc-card .guide {
      min-height: 1.2em;
    }

    .osc-card {
      grid-template-rows: auto auto 1fr auto;
      align-content: start;
    }

    .osc-card .knob-wrap {
      place-items: start center;
      align-self: start;
    }

    .osc-card .slider-wrap {
      align-self: start;
    }

    .osc-extras {
      grid-column: 1 / -1;
      margin-top: 8px;
      border-top: 1px solid rgba(108, 137, 164, 0.4);
      padding-top: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
    }

    .section-empty {
      border: 1px dashed rgba(117, 143, 168, 0.55);
      border-radius: 10px;
      color: #9ab2c7;
      font-size: 12px;
      padding: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .section-osc { grid-column: span 2; }
    .section-filter { grid-column: span 1; }
    .section-env { grid-column: span 1; }
    .section-lfo { grid-column: span 1; }
    .section-fx { grid-column: span 1; }
    .section-amp { grid-column: span 1; }
    .section-system { grid-column: span 1; }

    .keyboard-panel,
    .telemetry-grid {
      position: relative;
      z-index: 1;
    }

    .keyboard-panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(27, 37, 48, 0.9);
      padding: 8px;
      position: sticky;
      top: 8px;
      z-index: 7;
      box-shadow: 0 8px 20px rgba(5, 10, 16, 0.35);
    }

    .keyboard-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .keyboard-toolbar label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .keyboard-toolbar select,
    .keyboard-toolbar input[type="range"] {
      background: #1b2633;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      padding: 2px 6px;
    }

    .keyboard-toolbar input[type="range"] {
      width: 100px;
      padding: 0;
    }

    .keyboard-toolbar .chord-toggle {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 8px;
      background: rgba(20, 30, 41, 0.8);
      color: #c6d9ea;
      text-transform: none;
      letter-spacing: 0.02em;
      gap: 8px;
    }

    .keyboard-toolbar .chord-toggle input[type="checkbox"] {
      accent-color: #f3b855;
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .keyboard-meta {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
    }

    .keyboard {
      overflow-x: auto;
      padding-bottom: 4px;
      white-space: nowrap;
    }

    .keyboard-octave {
      position: relative;
      display: inline-block;
      width: 196px;
      height: 122px;
      margin-right: 2px;
      border: 1px solid #2e4258;
      border-radius: 8px;
      background: #0f1620;
      overflow: hidden;
    }

    .piano-key {
      position: absolute;
      border: 1px solid #203547;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 10px;
      letter-spacing: 0.03em;
      padding-bottom: 6px;
    }

    .piano-key.white {
      width: 28px;
      height: 120px;
      background: linear-gradient(180deg, #f6f9ff, #dce7f2);
      color: #3c4d60;
      z-index: 1;
    }

    .piano-key.black {
      width: 18px;
      height: 72px;
      background: linear-gradient(180deg, #2b3b4c, #141e2a);
      border-color: #3a4d61;
      color: #98afc5;
      z-index: 3;
    }

    .piano-key.white.active {
      background: linear-gradient(180deg, #ffe0a7, #f0c168);
      color: #3d2a04;
    }

    .piano-key.black.active {
      background: linear-gradient(180deg, #f0c168, #b1812d);
      color: #2a1a00;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-strong);
      padding: 8px;
      min-height: 130px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 6px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .name {
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 12px;
      color: var(--muted);
    }

    .ctrl-type {
      border: 1px solid rgba(69, 97, 122, 0.9);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9db5ca;
      background: rgba(22, 33, 46, 0.75);
    }

    .value {
      justify-self: end;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    .knob-wrap {
      display: grid;
      place-items: center;
    }

    .slider-wrap {
      display: grid;
      align-items: center;
      padding: 0 4px;
    }

    .level-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      border-radius: 999px;
      border: 1px solid rgba(84, 114, 140, 0.9);
      background:
        linear-gradient(90deg,
          rgba(243, 184, 85, 0.95) 0%,
          rgba(243, 184, 85, 0.95) var(--slider-fill, 0%),
          rgba(50, 70, 93, 0.95) var(--slider-fill, 0%),
          rgba(50, 70, 93, 0.95) 100%);
      outline: none;
      cursor: pointer;
    }

    .level-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid #f2be63;
      background: #faf3e6;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.18);
    }

    .level-slider::-moz-range-thumb {
      width: 12px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid #f2be63;
      background: #faf3e6;
    }

	    .knob {
	      -webkit-appearance: none;
	      appearance: none;
      width: 82px;
      height: 82px;
      border-radius: 50%;
	      border: 1px solid var(--line);
	      background:
	        conic-gradient(from -180deg,
	          var(--accent) 0deg var(--knob-angle, 0deg),
	          #32465d var(--knob-angle, 0deg) 360deg),
	        radial-gradient(circle at 45% 40%, #7188a0, #3a4b5f 60%, #2a3646);
      cursor: pointer;
      outline: none;
      padding: 0;
    }

    .knob::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 6px;
      height: 26px;
      border-radius: 4px;
      background: #faf3e6;
      border: 1px solid #f2be63;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.15);
      margin-top: 28px;
    }

    .knob::-moz-range-thumb {
      width: 6px;
      height: 26px;
      border-radius: 4px;
      background: #faf3e6;
      border: 1px solid #f2be63;
    }

    .switch {
      align-self: center;
      justify-self: center;
      width: 74px;
      height: 34px;
      border-radius: 999px;
      background: #304255;
      border: 1px solid var(--line);
      position: relative;
      cursor: pointer;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #dce8f1;
      transition: transform 120ms ease;
    }

    .switch.on {
      background: rgba(57, 209, 141, 0.25);
      border-color: rgba(57, 209, 141, 0.5);
    }

    .switch.on::after {
      transform: translateX(38px);
    }

    .switch-note {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .toggle {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #243041;
    }

    .toggle-btn {
      border: 0;
      border-right: 1px solid #33495f;
      border-radius: 0;
      background: transparent;
      color: #9cb3c7;
      padding: 8px 6px;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .toggle-btn:last-child {
      border-right: 0;
    }

    .toggle-btn.active {
      background: rgba(57, 209, 141, 0.24);
      color: #d9f4e8;
    }

    .knob.click-knob {
      border-color: #5d7a95;
      box-shadow: 0 0 0 2px rgba(23, 35, 47, 0.5), 0 0 0 1px rgba(157, 181, 202, 0.2) inset;
    }

    .guide {
      color: #a7bccf;
      font-size: 11px;
      line-height: 1.2;
      min-height: 2.4em;
      letter-spacing: 0.01em;
    }

    .knob-wrap.inactive {
      opacity: 0.55;
      filter: saturate(0.75);
    }

    .viz-card {
      min-height: 172px;
      grid-template-rows: auto auto auto;
      gap: 8px;
    }

    .viz-frame {
      border: 1px solid rgba(79, 105, 129, 0.85);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(23, 35, 48, 0.92), rgba(16, 25, 35, 0.94)),
        repeating-linear-gradient(
          0deg,
          rgba(151, 182, 210, 0.06) 0px,
          rgba(151, 182, 210, 0.06) 1px,
          transparent 1px,
          transparent 14px
        );
      padding: 4px;
    }

    .viz-canvas {
      display: block;
      width: 100%;
      height: 94px;
      border-radius: 7px;
      background: rgba(8, 13, 19, 0.35);
    }

    .viz-caption {
      color: #a7bccf;
      font-size: 11px;
      line-height: 1.2;
      min-height: 1.2em;
      letter-spacing: 0.01em;
    }

    .mono {
      font-family: "JetBrains Mono", "Consolas", "Menlo", monospace;
      font-size: 12px;
    }

    .screen {
      height: 195px;
      border: 1px solid #2f4a5f;
      border-radius: 10px;
      padding: 10px;
      background:
        repeating-linear-gradient(180deg, rgba(17, 53, 40, 0.84), rgba(17, 53, 40, 0.84) 13px, rgba(13, 40, 31, 0.86) 13px, rgba(13, 40, 31, 0.86) 26px);
      color: #94f7b6;
      white-space: pre;
      overflow: auto;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.35);
      margin-bottom: 8px;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 8px;
      align-items: stretch;
    }

    .stats {
      margin-bottom: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;

    function normalizeSchema(schema) {

        const override = PARAM_RANGE_OVERRIDES[id];
        const forcedPage = (id === 46) ? "system" : p.page;
        const min = override ? override[0] : (Number.isFinite(p.min) ? Number(p.min) : 0);
        const max = override ? override[1] : (Number.isFinite(p.max) ? Number(p.max) : 127);
        const boundedMin = Math.max(0, Math.min(127, Math.round(min)));
        const boundedMax = Math.max(boundedMin, Math.min(127, Math.round(max)));
        const defRaw = Number.isFinite(p.default) ? Number(p.default) : boundedMin;
        const def = Math.max(boundedMin, Math.min(boundedMax, Math.round(defRaw)));
        return { ...p, page: forcedPage, min: boundedMin, max: boundedMax, default: def };

    function nearestOptionValue(options, rawValue) {
      if (!Array.isArray(options) || options.length === 0) {
        return clampMidi7(rawValue);
      }
      let best = options[0].value;
      let bestDist = Math.abs(Number(rawValue) - Number(best));
      for (const option of options) {
        const candidate = Number(option.value);
        const dist = Math.abs(Number(rawValue) - candidate);
        if (dist < bestDist) {
          best = candidate;
          bestDist = dist;
        }
      }
      return clampMidi7(best);
    }

      if (!Array.isArray(options) || options.length === 0) {
        return null;

      const snapped = nearestOptionValue(options, value);
      for (const option of options) {
        if (Number(option.value) === snapped) {
          return option.label;
        }
      }
      return null;
    }

    function clampParamValue(param, rawValue) {
      const min = Number.isFinite(param && param.min) ? Number(param.min) : 0;
      const max = Number.isFinite(param && param.max) ? Number(param.max) : 127;
      let value = Number.isFinite(rawValue) ? Math.round(rawValue) : min;
      if (value < min) {
        value = min;
      } else if (value > max) {
        value = max;
      }
      if (param && param.name === "osc1_shape") {
        if (value < 32) {
          value = 0;
        } else if (value < 64) {
          value = 42;
        } else if (value < 96) {
          value = 84;
        } else {
          value = 127;
        }
      }
      const spec = uiSpecForParam(param);
      if (spec.control === "click-knob" && Array.isArray(spec.options) && spec.options.length > 0) {
        value = nearestOptionValue(spec.options, value);
      }
      if (spec.control === "toggle" && Array.isArray(spec.options) && spec.options.length > 0) {

      }
      if (param && /^(voice_mode|bypass_fx|osc_supersaw|infinite_drop)$/.test(param.name || "")) {

    function queueLine(line) {

      txQueue.push(line);

    async function drainTx() {
      if (txBusy || !writer) {

      txBusy = true;

        while (txQueue.length > 0 && writer) {
          const line = txQueue.shift();
          await writer.write(encoder.encode(line + "\n"));
          txCount += 1;
          updateIoInfo();
          pushLog("TX " + line);
        }
      } catch (err) {
        pushLog("TX ERROR " + err.message, true);
        await disconnect();

    function clampMidi7(raw) {

    function chordModeEnabled() {

    function chordRootMidi() {
      const semitone = clampMidi7(Number(kbChordRootEl ? kbChordRootEl.value : 0));

    function chordAnchorMidiForTrigger(note) {
      const trigger = clampMidi7(note);
      const root = chordRootMidi();
      const keyboardBase = keyboardStartNote();
      const transposed = root + (trigger - keyboardBase);
      return clampMidi7(transposed);
    }

    function chordNotesForTrigger(note) {
      const trigger = clampMidi7(note);
      if (!chordModeEnabled()) {
        return [trigger];

      const root = chordAnchorMidiForTrigger(trigger);
      const chordType = (kbChordTypeEl && CHORD_INTERVALS[kbChordTypeEl.value]) ? kbChordTypeEl.value : "major";
      const intervals = CHORD_INTERVALS[chordType];
      const out = [];
      for (const interval of intervals) {

      return Array.from(new Set(out));

    function noteAcquireSingle(note, velocity) {
      const midiNote = clampMidi7(note);
      const count = heldNotes.get(midiNote) || 0;
      if (count === 0) {
        sendNoteOn(midiNote, velocity);
        setNoteVisual(midiNote, true);
      }
      heldNotes.set(midiNote, count + 1);
    }

    function noteReleaseSingle(note) {
      const midiNote = clampMidi7(note);
      const count = heldNotes.get(midiNote) || 0;
      if (count <= 1) {
        heldNotes.delete(midiNote);
        sendNoteOff(midiNote, 0);
        setNoteVisual(midiNote, false);
      } else {
        heldNotes.set(midiNote, count - 1);
      }
    }

    function noteAcquire(note, velocity) {
      const trigger = clampMidi7(note);
      const entry = heldTriggers.get(trigger);
      if (entry) {
        entry.count += 1;
        return;
      }
      const notes = chordNotesForTrigger(trigger);
      heldTriggers.set(trigger, { count: 1, notes });
      for (const chordNote of notes) {
        noteAcquireSingle(chordNote, velocity);
      }
    }

    function noteRelease(note) {
      const trigger = clampMidi7(note);
      const entry = heldTriggers.get(trigger);
      if (!entry) {
        noteReleaseSingle(trigger);
        return;
      }
      if (entry.count > 1) {
        entry.count -= 1;
        return;
      }
      heldTriggers.delete(trigger);
      for (const chordNote of entry.notes) {
        noteReleaseSingle(chordNote);
      }
    }

    function releaseAllHeldNotes() {
      const notes = Array.from(heldNotes.keys());
      for (const note of notes) {

        setNoteVisual(note, false);

      heldTriggers.clear();
      pointerToNote.clear();
      keyboardCodeToNote.clear();

    function createPianoKey({ note, isBlack, leftPx, label }) {
      const key = document.createElement("button");
      key.type = "button";
      key.className = `piano-key ${isBlack ? "black" : "white"}`;
      key.style.left = `${String(leftPx)}px`;
      key.dataset.note = String(note);
      key.title = `${noteLabel(note)} (${note})`;
      key.textContent = label;

      const pointerDown = (ev) => {
        ev.preventDefault();
        const noteVal = Number(key.dataset.note);
        pointerToNote.set(ev.pointerId, noteVal);
        key.setPointerCapture(ev.pointerId);
        noteAcquire(noteVal, keyboardVelocity());
      };
      const pointerUp = (ev) => {
        const noteVal = pointerToNote.get(ev.pointerId);
        if (noteVal === undefined) {
          return;
        }
        pointerToNote.delete(ev.pointerId);
        noteRelease(noteVal);
      };

      key.addEventListener("pointerdown", pointerDown);
      key.addEventListener("pointerup", pointerUp);
      key.addEventListener("pointercancel", pointerUp);
      key.addEventListener("lostpointercapture", pointerUp);

    function renderKeyboard() {
      keyboardEl.innerHTML = "";

      const octaves = keyboardOctaveCount();

        const octaveEl = document.createElement("div");

        for (let i = 0; i < WHITE_SEMITONES.length; ++i) {

          const note = clampMidi7(octaveRoot + semitone);
          const white = createPianoKey({
            note,
            isBlack: false,
            leftPx: i * 28,
            label: noteLabel(note)
          });
          octaveEl.appendChild(white);
        }

        for (const blackDef of BLACK_KEYS) {
          const note = clampMidi7(octaveRoot + blackDef.semitone);
          const black = createPianoKey({
            note,
            isBlack: true,
            leftPx: (blackDef.whiteIndex * 28) + 19,
            label: blackDef.label
          });
          octaveEl.appendChild(black);
        }

        keyboardEl.appendChild(octaveEl);

    function scheduleFlush(delayMs = LIVE_FLUSH_DELAY_MS) {

          const [id, value] = updates[0];
          queueLine(`SETQ ${id} ${value}`);
        } else {

          queueLine(`BATCHQ ${payload}`);
        }
      }, Math.max(20, delayMs));

    function mapLinear(value, inMin, inMax, outMin, outMax) {
      const x = (value - inMin) / Math.max(1e-9, inMax - inMin);
      const t = Math.max(0, Math.min(1, x));
      return outMin + ((outMax - outMin) * t);
    }

    function mapExp01(t, minVal, maxVal) {
      const clamped = Math.max(0, Math.min(1, t));
      return minVal * Math.pow(maxVal / minVal, clamped);

    class BrowserDspEngine {
      constructor(initialState, paramByIdMap, paramByNameMap) {
        this.state = { ...initialState };
        this.paramById = paramByIdMap;
        this.paramByName = paramByNameMap;
        this.ctx = null;
        this.inputBus = null;
        this.hpFilter = null;
        this.lpFilter = null;

        this.wetGain = null;

        this.lfoOut = null;

      valueByName(name, fallback = 0) {
        const p = this.paramByName.get(name);
        if (!p) {
          return fallback;
        }
        const raw = (this.state[p.id] !== undefined) ? this.state[p.id] : p.default;
        return clampParamValue(p, raw);

      async start() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) {
          throw new Error("Web Audio API unavailable");
        }
        this.ctx = new Ctx({ latencyHint: "interactive" });
        await this.ctx.resume();

        const ctx = this.ctx;
        this.inputBus = ctx.createGain();
        this.hpFilter = ctx.createBiquadFilter();
        this.hpFilter.type = "highpass";
        this.lpFilter = ctx.createBiquadFilter();
        this.lpFilter.type = "lowpass";
        this.preFx = ctx.createGain();
        this.dryGain = ctx.createGain();
        this.wetGain = ctx.createGain();
        this.chorusSend = ctx.createGain();
        this.delaySend = ctx.createGain();
        this.reverbSend = ctx.createGain();
        this.chorusDelay = ctx.createDelay(0.05);
        this.chorusWet = ctx.createGain();
        this.delayNode = ctx.createDelay(1.5);
        this.delayFeedback = ctx.createGain();
        this.delayWet = ctx.createGain();
        this.reverbConvolver = ctx.createConvolver();
        this.reverbWet = ctx.createGain();
        this.master = ctx.createGain();
        this.panner = ctx.createStereoPanner();

        this.inputBus.connect(this.hpFilter);
        this.hpFilter.connect(this.lpFilter);
        this.lpFilter.connect(this.preFx);

        this.preFx.connect(this.dryGain);
        this.preFx.connect(this.wetGain);
        this.wetGain.connect(this.chorusSend);
        this.wetGain.connect(this.delaySend);
        this.wetGain.connect(this.reverbSend);

        this.chorusSend.connect(this.chorusDelay);
        this.chorusDelay.connect(this.chorusWet);

        this.delaySend.connect(this.delayNode);
        this.delayNode.connect(this.delayFeedback);
        this.delayFeedback.connect(this.delayNode);
        this.delayNode.connect(this.delayWet);

        this.reverbSend.connect(this.reverbConvolver);
        this.reverbConvolver.connect(this.reverbWet);

        this.dryGain.connect(this.master);
        this.chorusWet.connect(this.master);
        this.delayWet.connect(this.master);
        this.reverbWet.connect(this.master);

        this.master.connect(this.panner);
        this.panner.connect(ctx.destination);

        this.lfoOsc = ctx.createOscillator();
        this.lfoOut = ctx.createGain();
        this.lfoOsc.connect(this.lfoOut);
        this.lfoOsc.start();

        this.noiseBuffer = this._createNoiseBuffer();
        this.reverbConvolver.buffer = this._createReverbImpulse();
        this.applyAllParams(this.state);
      }

      async stop() {
        this._releaseAllVoices(0.02);
        if (this.ctx) {
          try {
            await this.ctx.close();
          } catch {}
        }
        this.ctx = null;
      }

      applyAllParams(nextState) {
        this.state = { ...this.state, ...nextState };
        this._updateGlobalNodes();
        this._updateVoiceNodes();
      }

      applyParam(id, value) {
        this.state[id] = value;
        this._updateGlobalNodes();
        this._updateVoiceNodes();
      }

      noteOn(note, velocity) {
        if (!this.ctx) {
          return;
        }
        const mono = this.valueByName("voice_mode", 0) >= 64;
        if (mono) {
          this._releaseAllVoices(0.01);
        }
        const voice = this._allocateVoice();
        this._startVoice(voice, note, velocity);
      }

      noteOff(note) {
        if (!this.ctx) {
          return;
        }
        const now = this.ctx.currentTime;
        for (const voice of this.voices) {
          if (voice.note === note && !voice.released) {
            this._releaseVoice(voice, now);
          }
        }
      }

      _allocateVoice() {
        if (this.voices.length < this.maxVoices) {
          const v = { id: this.voiceSerial++, note: -1, released: true, startedAt: 0 };
          this.voices.push(v);
          return v;
        }
        let oldest = this.voices[0];
        for (const voice of this.voices) {
          if (voice.startedAt < oldest.startedAt) {
            oldest = voice;
          }
        }
        this._hardStopVoice(oldest);
        return oldest;
      }

      _waveTypeFromParam(name, fallback = "sawtooth") {
        const v = this.valueByName(name, 0);
        const tonalWave = (name === "osc2_wave" || name === "osc3_wave" || name === "osc4_wave" || name === "osc1_wave");
        if (tonalWave) {
          if (v < 21) {
            return "sawtooth";
          }
          if (v < 53) {
            return "square";
          }
          if (v < 74) {
            return "triangle";
          }
          return "sine";
        }
        if (v < 32) {
          return "triangle";
        }
        if (v < 64) {
          return "square";
        }
        if (v < 96) {
          return "sawtooth";
        }
        return "sine";
      }

      _createNoiseBuffer() {
        const ctx = this.ctx;
        const duration = 1.0;
        const len = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; ++i) {
          data[i] = (Math.random() * 2) - 1;
        }
        return buf;
      }

      _createReverbImpulse() {
        const ctx = this.ctx;
        const seconds = 1.6;
        const len = Math.max(1, Math.floor(ctx.sampleRate * seconds));
        const impulse = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let ch = 0; ch < 2; ++ch) {
          const data = impulse.getChannelData(ch);
          for (let i = 0; i < len; ++i) {
            const t = i / len;
            const decay = Math.pow(1 - t, 2.6);
            data[i] = ((Math.random() * 2) - 1) * decay * 0.45;
          }
        }
        return impulse;
      }

      _startVoice(voice, note, velocity) {
        const ctx = this.ctx;
        const now = ctx.currentTime;
        const portamento = mapLinear(this.valueByName("portamento", 0), 0, 127, 0.0, 0.35);
        const driftCents = (this.valueByName("osc_drift", 64) - 64) * 0.8;
        const osc1Semi = this.valueByName("osc1_freq", 64) - 64;
        const osc2Semi = this.valueByName("osc2_coarse", 64) - 64;
        const osc3Semi = this.valueByName("osc3_freq", 64) - 64;
        const osc4Semi = this.valueByName("osc4_freq", 64) - 64;
        const detuneCents = (this.valueByName("osc2_detune", 64) - 64) * 1.6;
        const supersaw = this.valueByName("osc_supersaw", 0) >= 64;
        const infiniteDropEnabled = this.valueByName("infinite_drop", 0) >= 64;
        const pbRange = Math.max(0, Math.min(31, this.valueByName("pb_range", 2))) * 4;
        const pitchEnvRaw = this.valueByName("pitch_env_bend", 64) - 64;
        let pitchEnvBend14 = 0;
        if (pitchEnvRaw > 0) {
          pitchEnvBend14 = Math.round((pitchEnvRaw / 63) * 8191);
        } else if (pitchEnvRaw < 0) {
          pitchEnvBend14 = -Math.round(((-pitchEnvRaw) / 64) * 8192);
        }
        const pitchEnvCents = (pitchEnvBend14 / 8192) * pbRange * 100;
        const pitchEnvTimeNorm = this.valueByName("pitch_env_time", 0) / 127;
        const pitchEnvSeconds = (Math.abs(pitchEnvCents) > 0.01 && pitchEnvTimeNorm > 0.001)
          ? mapExp01(pitchEnvTimeNorm, 0.01, 2.5)
          : 0;

        voice.note = note;
        voice.startedAt = now;
        voice.released = false;
        voice.baseHz = midiToHz(note);
        voice.node = ctx.createGain();
        voice.node.gain.value = 0;
        voice.node.connect(this.inputBus);
        voice.parts = [];
        voice.lfoDepthNodes = [];

        const oscMix = this.valueByName("osc_mix", 64) / 127;
        const osc1Slider = this.valueByName("osc1_level", 127) / 127;
        const osc2Slider = this.valueByName("osc2_level", 127) / 127;
        const osc3Slider = this.valueByName("osc3_level", 0) / 127;
        const osc4Slider = this.valueByName("osc4_level", 0) / 127;
        const osc1Level = osc1Slider * (1.0 - oscMix);
        const osc2Level = osc2Slider * oscMix;
        const osc3Level = osc3Slider * 0.9;
        const osc4Level = osc4Slider * 0.9;
        const subNoiseRaw = this.valueByName("sub_noise_mix", 64);
        const subNoiseDelta = subNoiseRaw - 64;
        let subLevel = 0;
        let noiseLevel = 0;
        if (subNoiseDelta >= 0) {
          const t = Math.min(1, Math.max(0, subNoiseDelta / 63));
          subLevel = Math.pow(t, 0.65) * 0.34;
        } else {
          const t = Math.min(1, Math.max(0, (-subNoiseDelta) / 64));
          noiseLevel = Math.pow(t, 1.35) * 0.22;
        }

        const createOsc = (type, hz, cents, gainValue) => {
          const osc = ctx.createOscillator();
          osc.type = type;
          const gain = ctx.createGain();
          gain.gain.value = gainValue;
          const lfoDepth = ctx.createGain();
          lfoDepth.gain.value = 0;
          this.lfoOut.connect(lfoDepth);
          lfoDepth.connect(osc.detune);
          osc.connect(gain);
          gain.connect(voice.node);
          const target = Math.max(20, hz);
          osc.frequency.setValueAtTime(target, now);
          if (portamento > 0) {
            osc.frequency.setTargetAtTime(target, now, Math.max(0.002, portamento * 0.25));
          }
          osc.detune.setValueAtTime(cents + pitchEnvCents, now);
          if (pitchEnvSeconds > 0) {
            osc.detune.linearRampToValueAtTime(cents, now + pitchEnvSeconds);
          }
          if (infiniteDropEnabled) {
            const dropStart = now + (pitchEnvSeconds > 0 ? pitchEnvSeconds : 0);
            osc.detune.setTargetAtTime(cents - 9600, dropStart, 4.0);
          }
          osc.start(now);
          voice.parts.push({ osc, gain, lfoDepth, isNoise: false });
          voice.lfoDepthNodes.push(lfoDepth);
        };

        const osc1Type = supersaw ? "sawtooth" : this._waveTypeFromParam("osc1_shape", "sawtooth");
        const osc2Type = supersaw ? "sawtooth" : this._waveTypeFromParam("osc2_wave", "triangle");
        const osc3Type = this._waveTypeFromParam("osc3_wave", "triangle");
        const osc4Type = this._waveTypeFromParam("osc4_wave", "sine");
        const osc1Hz = voice.baseHz * Math.pow(2, osc1Semi / 12);
        const osc2Hz = voice.baseHz * Math.pow(2, osc2Semi / 12);
        const osc3Hz = voice.baseHz * Math.pow(2, osc3Semi / 12);
        const osc4Hz = voice.baseHz * Math.pow(2, osc4Semi / 12);

        if (supersaw) {
          const spread = 6 + Math.max(0, detuneCents * 0.35);
          const detuneTable = [-3, -2, -1, 0, 1, 2, 3];
          for (let i = 0; i < detuneTable.length; ++i) {
            const cents = driftCents + (detuneTable[i] * spread);
            createOsc("sawtooth", osc1Hz, cents, (osc1Level * 0.16));
            createOsc("sawtooth", osc2Hz, cents + detuneCents, (osc2Level * 0.16));
          }
        } else {
          createOsc(osc1Type, osc1Hz, driftCents, osc1Level);
          createOsc(osc2Type, osc2Hz, driftCents + detuneCents, osc2Level);
          if (osc3Level > 0.001) {
            createOsc(osc3Type, osc3Hz, driftCents - (detuneCents * 0.7), osc3Level);
          }
          if (osc4Level > 0.001) {
            createOsc(osc4Type, osc4Hz, driftCents + (detuneCents * 0.7), osc4Level);
          }
        }

        if (subLevel > 0.0005) {
          createOsc("sine", Math.max(20, osc1Hz * 0.5), driftCents * 0.35, subLevel);
        }

        if (noiseLevel > 0.0005) {
          const noiseSrc = ctx.createBufferSource();
          noiseSrc.buffer = this.noiseBuffer;
          noiseSrc.loop = true;
          const noiseGain = ctx.createGain();
          noiseGain.gain.value = noiseLevel;
          noiseSrc.connect(noiseGain);
          noiseGain.connect(voice.node);
          noiseSrc.start(now);
          voice.parts.push({ osc: noiseSrc, gain: noiseGain, isNoise: true });
        }

        const velNorm = Math.max(0.05, Math.min(1.0, velocity / 127));
        const attack = mapExp01(this.valueByName("amp_attack", 0) / 127, 0.002, 1.8);
        const decay = mapExp01(this.valueByName("amp_decay", 48) / 127, 0.02, 2.4);
        const sustain = mapLinear(this.valueByName("amp_sustain", 127), 0, 127, 0, 1.0);
        const peak = velNorm * 0.5;
        voice.node.gain.cancelScheduledValues(now);
        voice.node.gain.setValueAtTime(0.0001, now);
        voice.node.gain.linearRampToValueAtTime(peak, now + attack);
        voice.node.gain.linearRampToValueAtTime(Math.max(0.0001, peak * sustain), now + attack + decay);

        this._updateVoiceLfoDepth(voice);
      }

      _releaseAllVoices(minReleaseS = 0.03) {
        if (!this.ctx) {
          this.voices = [];
          return;
        }
        const now = this.ctx.currentTime;
        for (const voice of this.voices) {
          if (voice.node && !voice.released) {
            const release = Math.max(minReleaseS, mapExp01(this.valueByName("amp_release", 48) / 127, 0.03, 3.2));
            voice.node.gain.cancelScheduledValues(now);
            voice.node.gain.setTargetAtTime(0.0001, now, Math.max(0.005, release * 0.3));
            voice.released = true;
            const stopAt = now + release + 0.08;
            this._stopVoiceParts(voice, stopAt);
          } else {
            this._hardStopVoice(voice);
          }
        }
      }

      _releaseVoice(voice, now) {
        const release = mapExp01(this.valueByName("amp_release", 48) / 127, 0.03, 3.2);
        voice.node.gain.cancelScheduledValues(now);
        voice.node.gain.setTargetAtTime(0.0001, now, Math.max(0.005, release * 0.3));
        voice.released = true;
        this._stopVoiceParts(voice, now + release + 0.08);
      }

      _stopVoiceParts(voice, stopAt) {
        for (const part of (voice.parts || [])) {
          try {
            if (part.osc && part.osc.stop) {
              part.osc.stop(stopAt);
            }
          } catch {}
          if (part.gain) {
            try {
              part.gain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.01);
            } catch {}
          }
        }
        setTimeout(() => this._hardStopVoice(voice), Math.max(20, Math.floor((stopAt - this.ctx.currentTime) * 1000) + 20));
      }

      _hardStopVoice(voice) {
        if (!voice) {
          return;
        }
        for (const part of (voice.parts || [])) {
          if (part.lfoDepth) {
            try {
              this.lfoOut.disconnect(part.lfoDepth);
            } catch {}
          }
          if (part.osc) {
            try {
              if (part.osc.stop) {
                part.osc.stop();
              }
            } catch {}
            try {
              part.osc.disconnect();
            } catch {}
          }
          if (part.gain) {
            try {
              part.gain.disconnect();
            } catch {}
          }
        }
        if (voice.node) {
          try {
            voice.node.disconnect();
          } catch {}
        }
        voice.parts = [];
        voice.note = -1;
        voice.released = true;
      }

      _updateVoiceLfoDepth(voice) {
        const depth = this.valueByName("lfo_depth", 0) / 127;
        const oscAmt = this.valueByName("lfo_osc_amt", 64) / 127;
        const lfoDepthCents = depth * oscAmt * 135;
        for (const node of (voice.lfoDepthNodes || [])) {
          node.gain.setTargetAtTime(lfoDepthCents, this.ctx.currentTime, 0.02);
        }
      }

      _updateVoiceNodes() {
        if (!this.ctx) {
          return;
        }
        for (const voice of this.voices) {
          if (!voice || !voice.parts || voice.parts.length === 0) {
            continue;
          }
          this._updateVoiceLfoDepth(voice);
        }
      }

      _updateGlobalNodes() {
        if (!this.ctx) {
          return;
        }
        const now = this.ctx.currentTime;
        const bypassFx = this.valueByName("bypass_fx", 0) >= 64;
        const filterMode = this.valueByName("filter_mode", 0);
        const cutoff = this.valueByName("filter_cutoff", 96) / 127;
        const reso = mapLinear(this.valueByName("filter_reso", 24), 0, 127, 0.7, 16);
        const cutoffHz = mapExp01(cutoff, 40, 15000);
        const hpHz = (filterMode >= 64) ? cutoffHz : 20;
        const lpHz = (filterMode >= 64) ? 18000 : cutoffHz;
        this.hpFilter.frequency.setTargetAtTime(hpHz, now, 0.02);
        this.lpFilter.frequency.setTargetAtTime(lpHz, now, 0.02);
        this.hpFilter.Q.setTargetAtTime(reso, now, 0.02);
        this.lpFilter.Q.setTargetAtTime(reso, now, 0.02);

        const gainNorm = this.valueByName("amp_gain", 100) / 127;
        // Raise top-end by ~10 dB so max AMP gain is meaningfully louder.
        const masterGain = mapExp01(gainNorm, 0.0005, 2.85);
        this.master.gain.setTargetAtTime(masterGain, now, 0.02);

        const panNorm = mapLinear(this.valueByName("pan", 64), 0, 127, -1, 1);
        this.panner.pan.setTargetAtTime(panNorm, now, 0.02);

        const lfoNorm = this.valueByName("lfo_rate", 40) / 127;
        const lfoMappedNorm = (65 + (lfoNorm * 62)) / 127;
        const lfoShaped = lfoMappedNorm * lfoMappedNorm * lfoMappedNorm;
        const lfoRateHz = mapExp01(lfoShaped, 0.2, 180.0);
        this.lfoOsc.frequency.setTargetAtTime(lfoRateHz, now, 0.02);
        this.lfoOsc.type = this._waveTypeFromParam("lfo_wave", "sine");

        const chorusMix = this.valueByName("chorus_mix", 0) / 127;
        const chorusDepthS = mapLinear(this.valueByName("chorus_depth", 64), 0, 127, 0.0004, 0.006);
        const chorusBaseS = mapLinear(this.valueByName("chorus_delay", 64), 0, 127, 0.004, 0.024);
        this.chorusDelay.delayTime.setTargetAtTime(chorusBaseS + chorusDepthS, now, 0.05);
        this.chorusWet.gain.setTargetAtTime((bypassFx ? 0 : chorusMix * 0.55), now, 0.05);

        const delayMix = this.valueByName("delay_mix", 0) / 127;
        const delayTime = mapLinear(this.valueByName("delay_time", 93), 0, 127, 0.04, 0.8);
        const delayFeedback = mapLinear(this.valueByName("delay_feedback", 64), 0, 127, 0.05, 0.84);
        this.delayNode.delayTime.setTargetAtTime(delayTime, now, 0.05);
        this.delayFeedback.gain.setTargetAtTime(delayFeedback, now, 0.05);
        this.delayWet.gain.setTargetAtTime((bypassFx ? 0 : delayMix * 0.7), now, 0.05);

        const reverbMix = this.valueByName("reverb_mix", 0) / 127;
        this.reverbWet.gain.setTargetAtTime((bypassFx ? 0 : reverbMix * 0.55), now, 0.05);

        this.wetGain.gain.setTargetAtTime(bypassFx ? 0 : 1.0, now, 0.04);
        this.dryGain.gain.setTargetAtTime(1.0, now, 0.04);
      }
    }

    function createEmulatorState() {
      return {
        connected: false,
        startedMs: nowMs(),
        lastStatsMs: nowMs(),
        statsTick: 0,
        audioCbOverBudget: 0,
        serial: {
          rx_lines: 0,
          rx_overflow: 0,
          rx_parse_errors: 0
        },
        state: seedLocalDefaults()
      };
    }

    function ensureEmulator() {
      if (!emulator) {
        emulator = createEmulatorState();
      }
      return emulator;
    }

    function emulateEmit(payload, delayMs = 8) {
      const jsonLine = JSON.stringify(payload);
      setTimeout(() => {
        void handleLine(jsonLine);
      }, Math.max(0, delayMs));
    }

    function emulateBuildStats() {
      const emu = ensureEmulator();
      const now = nowMs();
      const elapsedMs = Math.max(1, now - emu.startedMs);
      const statsDeltaMs = Math.max(1, now - emu.lastStatsMs);
      emu.lastStatsMs = now;
      emu.statsTick += 1;

      const audioFrames = Math.max(1, Math.floor(elapsedMs / 21));
      const serialActivity = Math.min(1200, emu.serial.rx_lines * 3 + txCount + rxCount);
      const audioCbLastUs = 10 + (serialActivity % 14);
      const audioCbMaxUs = 190 + (serialActivity % 140);
      const overBudgetDelta = (serialActivity > 700 && (emu.statsTick % 4 === 0)) ? 1 : 0;
      emu.audioCbOverBudget += overBudgetDelta;
      const pollRate = Math.max(1, Math.floor(1000 / statsDeltaMs));
      const overBudgetPctX100 = Math.min(10000, Math.floor((overBudgetDelta * pollRate * 10000) / 48));

      return {
        type: "stats",
        serial: {
          rx_lines: emu.serial.rx_lines,
          rx_overflow: emu.serial.rx_overflow,
          rx_parse_errors: emu.serial.rx_parse_errors
        },
        runtime: {
          queue_depth: 0,
          dropped_midi: 0,
          dropped_web: 0,
          dropped_hardware: 0,
          audio_overruns: 0,
          audio_cb_last_us: audioCbLastUs,
          audio_cb_max_us: audioCbMaxUs,
          audio_frames: audioFrames,
          audio_cb_over_budget: emu.audioCbOverBudget,
          audio_cb_over_budget_delta: overBudgetDelta,
          audio_cb_over_budget_pct_x100: overBudgetPctX100,
          sample_rate_hz: 48000,
          audio_frame_interval_us: 21,
          audio_render_div: 2,
          audio_callback_interval_us: 42,
          chorus_enabled: 0,
          delay_enabled: 0,
          exp_mod_dest_enabled: 0,
          restrict_osc_enabled: 0,
          core0_loop_last_us: 70 + (serialActivity % 850),
          core0_loop_max_us: 900 + (serialActivity % 3000),
          core0_midi_poll_last_us: 130 + (serialActivity % 500),
          core0_serial_poll_last_us: 100 + (serialActivity % 550),
          core0_control_poll_last_us: 1
        }
      };
    }

    function emulateApplyParam(idRaw, valueRaw) {
      const id = Number(idRaw);
      if (!Number.isFinite(id)) {
        return false;
      }
      const p = paramById.get(id);
      if (!p) {
        return false;
      }
      const next = clampByParamId(id, Number(valueRaw));
      state[id] = next;
      const emu = ensureEmulator();
      emu.state[id] = next;
      if (dspEngine) {
        dspEngine.applyParam(id, next);
      }
      setControlValue(id, next);
      return true;
    }

    function emulateApplyBatch(payload) {
      const parts = String(payload || "").split(",");
      let applied = 0;
      for (const rawPart of parts) {
        const part = rawPart.trim();
        if (part.length === 0) {
          continue;
        }
        const eq = part.indexOf("=");
        if (eq <= 0 || eq >= part.length - 1) {
          return -1;
        }
        const idPart = part.slice(0, eq).trim();
        const valuePart = part.slice(eq + 1).trim();
        if (!emulateApplyParam(idPart, valuePart)) {
          return -1;
        }
        applied += 1;
      }
      return applied;
    }

    async function emulateCommand(line) {
      const emu = ensureEmulator();
      if (!emu.connected) {
        return;
      }
      const text = String(line || "").trim();
      if (text.length === 0) {
        return;
      }
      emu.serial.rx_lines += 1;

      if (text === "PING") {
        emulateEmit({ type: "pong" });
        return;
      }
      if (text === "META") {
        emulateEmit({ type: "meta", pages: meta.pages, params: meta.params });
        return;
      }
      if (text === "STATE") {
        emulateEmit({ type: "state", values: emu.state });
        return;
      }
      if (text === "STATS") {
        emulateEmit(emulateBuildStats());
        return;
      }
      if (text === "HELP") {
        emulateEmit({
          type: "help",
          commands: [
            "PING", "META", "STATE", "STATS",
            "NOTEON <note> <vel>", "NOTEOFF <note> <vel>",
            "SET <id> <value>", "SETQ <id> <value>",
            "BATCH <id>=<value>,...", "BATCHQ <id>=<value>,..."
          ]
        });
        return;
      }
      if (text.startsWith("NOTEON ") || text.startsWith("NOTEOFF ")) {
        const parts = text.split(/\s+/);
        if (parts.length >= 3) {
          const note = clampMidi7(Number(parts[1]));
          const vel = clampMidi7(Number(parts[2]));
          if (dspEngine) {
            if (text.startsWith("NOTEON ")) {
              dspEngine.noteOn(note, vel);
            } else {
              dspEngine.noteOff(note);
            }
          }
        }
        return;
      }
      if (text.startsWith("SETQ ") || text.startsWith("SET ")) {
        const quiet = text.startsWith("SETQ ");
        const args = text.slice(quiet ? 5 : 4).trim().split(/\s+/);
        if (args.length < 2 || !emulateApplyParam(args[0], args[1])) {
          emu.serial.rx_parse_errors += 1;
          emulateEmit({ type: "error", message: "invalid SET payload" });
          return;
        }
        if (!quiet) {
          const id = Number(args[0]);
          emulateEmit({ type: "ack", cmd: "set", id, value: state[id] });
        }
        renderScreen();
        return;
      }
      if (text.startsWith("BATCHQ ") || text.startsWith("BATCH ")) {
        const quiet = text.startsWith("BATCHQ ");
        const payload = text.slice(quiet ? 7 : 6).trim();
        const applied = emulateApplyBatch(payload);
        if (applied < 0) {
          emu.serial.rx_parse_errors += 1;
          emulateEmit({ type: "error", message: "invalid BATCH payload" });
          return;
        }
        if (!quiet) {
          emulateEmit({ type: "ack", cmd: "batch", applied });
        }
        renderScreen();
        return;
      }

      emu.serial.rx_parse_errors += 1;
      emulateEmit({ type: "error", message: "unknown command" });
    }

    async function connectEmulator() {
      const emu = createEmulatorState();
      emu.connected = true;
      emulator = emu;

      meta = LOCAL_SCHEMA;
      rebuildParamIndex();
      state = { ...emu.state };
      dspEngine = new BrowserDspEngine(state, paramById, paramByName);
      try {
        await dspEngine.start();
        dspEngine.applyAllParams(state);
      } catch (err) {
        pushLog("EMU DSP ERROR " + ((err && err.message) ? err.message : String(err)), true);
        dspEngine = null;
      }
      renderPanelSections();
      renderScreen();

      setPortInfo();
      setConnectedUi(true);
      setStatus("Connected (Emu)", true);
      pushLog("CONNECTED (EMU)", true);
      startPolling();
      queueLine("PING");
      queueLine("STATS");
    }

    function pushAllCurrentState() {
      const entries = Object.entries(state);
      if (entries.length === 0) {
        return;
      }
      const chunkSize = 20;
      for (let i = 0; i < entries.length; i += chunkSize) {
        const chunk = entries.slice(i, i + chunkSize);
        const payload = chunk.map(([id, value]) => `${id}=${value}`).join(",");
        queueLine(`BATCHQ ${payload}`);
      }
    }

    function updateStatsView(stats) {

      const overBudgetPctX100 = Number(runtime.audio_cb_over_budget_pct_x100);

        ? `${(overBudgetPctX100 / 100).toFixed(2)}%`
        : "--";
      const lines = [
        ["queue_depth", runtime.queue_depth],
        ["dropped_midi", runtime.dropped_midi],
        ["dropped_web", runtime.dropped_web],
        ["dropped_hardware", runtime.dropped_hardware],
        ["audio_overruns", runtime.audio_overruns],
        ["audio_cb_last_us", runtime.audio_cb_last_us],
        ["audio_cb_max_us", runtime.audio_cb_max_us],
        ["audio_frames", runtime.audio_frames],
        ["audio_cb_over_budget", runtime.audio_cb_over_budget],
        ["audio_cb_over_budget_delta", runtime.audio_cb_over_budget_delta],
        ["audio_cb_over_budget_pct", overBudgetPct],
        ["sample_rate_hz", runtime.sample_rate_hz],
        ["audio_frame_interval_us", runtime.audio_frame_interval_us],
        ["audio_render_div", runtime.audio_render_div],

        ["chorus_enabled", runtime.chorus_enabled],

        ["core0_loop_last_us", runtime.core0_loop_last_us],

        ["core0_midi_poll_last_us", runtime.core0_midi_poll_last_us],

      statsGrid.innerHTML = "";
      for (const [k, v] of lines) {
