      }
      lastStats = stats;
    }

    function setKnobAngle(knobEl, value) {
      const min = Number(knobEl.min || 0);
      const max = Number(knobEl.max || 127);
      const span = Math.max(1, max - min);
      const normalized = (Number(value) - min) / span;
      const angle = Math.round(Math.max(0, Math.min(1, normalized)) * 360);
      knobEl.style.setProperty("--knob-angle", `${angle}deg`);
    }

    function setSliderFill(sliderEl, value) {
      const min = Number(sliderEl.min || 0);
      const max = Number(sliderEl.max || 127);
      const span = Math.max(1, max - min);
      const normalized = (Number(value) - min) / span;
      const pct = Math.round(Math.max(0, Math.min(1, normalized)) * 100);
      sliderEl.style.setProperty("--slider-fill", `${pct}%`);
    }

    function valueNormByName(name, fallback) {
      const param = paramByName.get(name);
      if (!param) {
        return Math.max(0, Math.min(1, Number.isFinite(fallback) ? Number(fallback) : 0));
      }
      const fallbackValue = Number.isFinite(fallback) ? Number(fallback) : Number(param.default || 0);
      const current = (state[param.id] !== undefined) ? Number(state[param.id]) : fallbackValue;
      const clamped = clampParamValue(param, current);
      const min = Number.isFinite(param.min) ? Number(param.min) : 0;
      const max = Number.isFinite(param.max) ? Number(param.max) : 127;
      const span = Math.max(1, max - min);
      return Math.max(0, Math.min(1, (clamped - min) / span));
    }

    function setCanvasDpr(canvas) {
      if (!canvas) {
        return null;
      }
      const bounds = canvas.getBoundingClientRect();
      const width = Math.max(16, Math.round(bounds.width));
      const height = Math.max(16, Math.round(bounds.height));
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const pixelWidth = Math.round(width * dpr);
      const pixelHeight = Math.round(height * dpr);
      if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
      }
      const ctx = canvas.getContext("2d");
      if (!ctx) {
        return null;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, width, height };
    }

    function drawEnvelopeVisualizer() {
      const configured = setCanvasDpr(envVizCanvas);
      if (!configured) {
        return;
      }
      const { ctx, width, height } = configured;
      const padX = 8;
      const padY = 8;
      const x0 = padX;
      const x4 = Math.max(x0 + 20, width - padX);
      const yTop = padY;
      const yBottom = Math.max(yTop + 20, height - padY);
      const plotW = x4 - x0;
      const plotH = yBottom - yTop;

      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = "rgba(144, 176, 204, 0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 4; ++i) {
        const x = x0 + (plotW * i) / 4;
        ctx.moveTo(x, yTop);
        ctx.lineTo(x, yBottom);
      }
      for (let i = 0; i <= 4; ++i) {
        const y = yTop + (plotH * i) / 4;
        ctx.moveTo(x0, y);
        ctx.lineTo(x4, y);
      }
      ctx.stroke();

      const attack = valueNormByName("amp_attack", 0 / 127);
      const decay = valueNormByName("amp_decay", 48 / 127);
      const sustain = valueNormByName("amp_sustain", 127 / 127);
      const release = valueNormByName("amp_release", 48 / 127);
      const aW = 0.1 + attack * 0.24;
      const dW = 0.1 + decay * 0.24;
      const rW = 0.12 + release * 0.28;
      const sW = Math.max(0.1, 1 - aW - dW - rW);
      const x1 = x0 + plotW * aW;
      const x2 = x1 + plotW * dW;
      const x3 = Math.min(x4 - plotW * rW, x2 + plotW * sW);
      const yPeak = yTop + plotH * 0.06;
      const ySustain = yBottom - (0.08 + sustain * 0.84) * plotH;

      ctx.beginPath();
      ctx.moveTo(x0, yBottom);
      ctx.lineTo(x1, yPeak);
      ctx.lineTo(x2, ySustain);
      ctx.lineTo(x3, ySustain);
      ctx.lineTo(x4, yBottom);
      ctx.strokeStyle = "#ff7e72";
      ctx.lineWidth = 2.2;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x0, yBottom);
      ctx.lineTo(x1, yPeak);
      ctx.lineTo(x2, ySustain);
      ctx.lineTo(x3, ySustain);
      ctx.lineTo(x4, yBottom);
      ctx.closePath();
      ctx.fillStyle = "rgba(255, 126, 114, 0.16)";
      ctx.fill();
    }

    function drawFilterVisualizer() {
      const configured = setCanvasDpr(filterVizCanvas);
      if (!configured) {
        return;
      }
      const { ctx, width, height } = configured;
      const padX = 8;
      const padY = 8;
      const xMin = padX;
      const xMax = Math.max(xMin + 20, width - padX);
      const yMin = padY;
      const yMax = Math.max(yMin + 20, height - padY);
      const plotW = xMax - xMin;
      const plotH = yMax - yMin;

      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = "rgba(144, 176, 204, 0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 4; ++i) {
        const x = xMin + (plotW * i) / 4;
        ctx.moveTo(x, yMin);
        ctx.lineTo(x, yMax);
      }
      for (let i = 0; i <= 4; ++i) {
        const y = yMin + (plotH * i) / 4;
        ctx.moveTo(xMin, y);
        ctx.lineTo(xMax, y);
      }
      ctx.stroke();

      const filterMode = valueNormByName("filter_mode", 0) >= 0.5 ? "hp" : "lp";
      const cutoff = valueNormByName("filter_cutoff", 96 / 127);
      const resonance = valueNormByName("filter_reso", 24 / 127);
      const cutoffPos = 0.06 + cutoff * 0.88;
      const slope = 8 + resonance * 24;
      const sigma = 0.012 + (1 - resonance) * 0.08;
      const maxResponse = 1.2;
      const pointCount = 80;

      ctx.beginPath();
      for (let i = 0; i < pointCount; ++i) {
        const t = i / (pointCount - 1);
        const logistic = 1 / (1 + Math.exp((t - cutoffPos) * slope));
        const base = (filterMode === "hp") ? (1 - logistic) : logistic;
        const distance = t - cutoffPos;
        const peak = Math.exp(-(distance * distance) / (2 * sigma * sigma));
        const response = Math.max(0, Math.min(maxResponse, base + peak * (0.08 + resonance * 0.56)));
        const x = xMin + t * plotW;
        const y = yMax - (response / maxResponse) * plotH;
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.strokeStyle = "#6ed7ff";
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.stroke();
    }

    function drawVisualizers() {
      drawEnvelopeVisualizer();
      drawFilterVisualizer();
    }

    function scheduleVisualizerDraw() {
      if (visualizerRaf) {
        return;
      }
      visualizerRaf = requestAnimationFrame(() => {
        visualizerRaf = 0;
        drawVisualizers();
      });
    }

    function renderScreen() {
      if (!meta) {
        screenEl.textContent = "WAITING FOR META...";
        return;
      }
      const lines = [];
      lines.push("PICO2W SYNTH");
      lines.push("------------");
      lines.push(`MODE ${uiMode.toUpperCase()}`);
      lines.push("");
      for (const name of PANEL_FOCUS_LINES) {
        const p = paramByName.get(name);
        if (!p) {
          continue;
        }
        const v = (state[p.id] !== undefined) ? state[p.id] : p.default;
        const key = (p.name + " ").slice(0, 15).padEnd(15, " ");
        lines.push(`${key}${formatParamValue(p, v).padStart(3, " ")}`);
      }
      if (lines.length <= 4) {
        lines.push("NO PARAMS");
      }
      if (lastStats && lastStats.runtime) {
        lines.push("");
        lines.push(`Q ${String(lastStats.runtime.queue_depth || 0).padStart(3, " ")}` +
          `  DR ${String(lastStats.runtime.dropped_web || 0).padStart(3, " ")}`);
      }
      screenEl.textContent = lines.join("\n");
      scheduleVisualizerDraw();
    }

    function setUiMode(nextMode) {
      uiMode = (nextMode === "advanced") ? "advanced" : "simple";
      uiModeBtn.textContent = (uiMode === "simple") ? "Simple Mode" : "Advanced Mode";
      if (meta && Array.isArray(meta.params)) {
        renderPanelSections();
        renderScreen();
      }
    }

    function createSwitchControl(param, current) {
      const wrap = document.createElement("div");
      const sw = document.createElement("button");
      sw.type = "button";
      sw.className = "switch" + (current >= 64 ? " on" : "");
      const note = document.createElement("div");
      note.className = "switch-note";
      note.textContent = current >= 64 ? "enabled" : "disabled";
      sw.onclick = () => {
        const next = (state[param.id] || 0) >= 64 ? 0 : 127;
        state[param.id] = next;
        if (dspEngine) {
          dspEngine.applyParam(param.id, next);
        }
        pending[param.id] = next;
        lastLocalEditMs = nowMs();
        sw.className = "switch" + (next >= 64 ? " on" : "");
        note.textContent = next >= 64 ? "enabled" : "disabled";
        scheduleFlush();
        renderScreen();
      };
      wrap.append(sw, note);
      return { wrap, sw, note };
    }

    function createToggleControl(param, current, spec, valueEl) {
      const wrap = document.createElement("div");
      const toggle = document.createElement("div");
      toggle.className = "toggle";
      const options = Array.isArray(spec && spec.options) ? spec.options : [
        { value: 0, label: "A" },
        { value: 127, label: "B" }
      ];
      const buttons = [];
      const setActive = (nextValue, emit) => {
        const clamped = clampParamValue(param, nextValue);
        for (const btn of buttons) {
          btn.classList.toggle("active", Number(btn.dataset.value) === clamped);
        }
        valueEl.textContent = formatParamValue(param, clamped);
        if (!emit) {
          return;
        }
        state[param.id] = clamped;
        if (dspEngine) {
          dspEngine.applyParam(param.id, clamped);
        }
        pending[param.id] = clamped;
        lastLocalEditMs = nowMs();
        setControlValue(param.id, clamped);
        scheduleFlush();
        renderScreen();
      };

      for (const option of options) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "toggle-btn";
        btn.textContent = option.label;
        btn.dataset.value = String(clampParamValue(param, Number(option.value)));
        btn.onclick = () => setActive(Number(btn.dataset.value), true);
        buttons.push(btn);
        toggle.appendChild(btn);
      }

      setActive(current, false);
      wrap.appendChild(toggle);
      return { wrap, buttons, options };
    }

    function isHeavyParam(param) {
      if (!param || !param.name) {
        return false;
      }
      if (param.page === "fx") {
        return true;
      }
      return /^(osc1_wave|osc2_wave|osc3_wave|osc4_wave|osc1_shape|osc1_morph|sub_noise_mix|osc1_freq|osc2_coarse|osc3_freq|osc4_freq|osc2_detune|osc_drift|lfo_osc_dst|eg_osc_dst)$/.test(param.name);
    }

    function createKnobControl(param, current, valueEl, spec = {}, options = {}) {
      const wrap = document.createElement("div");
      wrap.className = "knob-wrap";
      const heavyParam = (options.heavyParam !== undefined) ? Boolean(options.heavyParam) : isHeavyParam(param);
      const knob = document.createElement("input");
      knob.className = "knob" + ((spec.control === "click-knob") ? " click-knob" : "");
      knob.type = "range";
      knob.min = String(param.min);
      knob.max = String(param.max);
      if (spec.control === "click-knob") {
        knob.step = "1";
      }
      const normalizedCurrent = clampParamValue(param, current);
      knob.value = String(normalizedCurrent);
      setKnobAngle(knob, normalizedCurrent);
      let lastCommitted = normalizedCurrent;
      const modeParam = paramByName.get("filter_mode");
      const forcedMode = Number.isFinite(options.forceFilterMode) && modeParam
        ? clampParamValue(modeParam, Number(options.forceFilterMode))
        : null;

      const maybeApplyForcedMode = () => {
        if (forcedMode === null || !modeParam) {
          return false;
        }
        if (state[modeParam.id] === forcedMode) {
          return false;
        }
        state[modeParam.id] = forcedMode;
        if (dspEngine) {
          dspEngine.applyParam(modeParam.id, forcedMode);
        }
        pending[modeParam.id] = forcedMode;
        setControlValue(modeParam.id, forcedMode);
        return true;
      };

      const commitHeavyParam = () => {
        if (!heavyParam) {
          return;
        }
        const v = clampParamValue(param, Number(knob.value));
        knob.value = String(v);
        const modeChanged = maybeApplyForcedMode();
        if (v === lastCommitted) {
          if (modeChanged) {
            lastLocalEditMs = nowMs();
            scheduleFlush(HEAVY_RELEASE_FLUSH_DELAY_MS);
            renderScreen();
          }
          return;
        }
        lastCommitted = v;
        state[param.id] = v;
        pending[param.id] = v;
        lastLocalEditMs = nowMs();
        scheduleFlush(HEAVY_RELEASE_FLUSH_DELAY_MS);
        renderScreen();
      };

      knob.oninput = () => {
        const v = clampParamValue(param, Number(knob.value));
        knob.value = String(v);
        setKnobAngle(knob, v);
        valueEl.textContent = formatParamValue(param, v);
        state[param.id] = v;
        if (dspEngine) {
          dspEngine.applyParam(param.id, v);
        }
        maybeApplyForcedMode();
        lastLocalEditMs = nowMs();
        if (!heavyParam) {
          pending[param.id] = v;
          lastCommitted = v;
          scheduleFlush(LIVE_FLUSH_DELAY_MS);
        }
        renderScreen();
      };
      knob.onchange = commitHeavyParam;
      knob.addEventListener("pointerup", commitHeavyParam);
      knob.addEventListener("touchend", commitHeavyParam, { passive: true });
      wrap.appendChild(knob);
      return { wrap, knob };
    }

    function createSliderControl(param, current, valueEl, options = {}) {
      const wrap = document.createElement("div");
      wrap.className = "slider-wrap";
      const heavyParam = (options.heavyParam !== undefined) ? Boolean(options.heavyParam) : isHeavyParam(param);
      const slider = document.createElement("input");
      slider.className = "level-slider";
      slider.type = "range";
      slider.min = String(param.min);
      slider.max = String(param.max);
      slider.step = "1";
      const normalizedCurrent = clampParamValue(param, current);
      slider.value = String(normalizedCurrent);
      setSliderFill(slider, normalizedCurrent);

      slider.oninput = () => {
        const v = clampParamValue(param, Number(slider.value));
        slider.value = String(v);
        setSliderFill(slider, v);
        valueEl.textContent = formatParamValue(param, v);
        state[param.id] = v;
        if (dspEngine) {
          dspEngine.applyParam(param.id, v);
        }
        lastLocalEditMs = nowMs();
        if (!heavyParam) {
          pending[param.id] = v;
          scheduleFlush(LIVE_FLUSH_DELAY_MS);
        }
        renderScreen();
      };

      slider.onchange = () => {
        if (!heavyParam) {
          return;
        }
        const v = clampParamValue(param, Number(slider.value));
        slider.value = String(v);
        setSliderFill(slider, v);
        state[param.id] = v;
        if (dspEngine) {
          dspEngine.applyParam(param.id, v);
        }
        pending[param.id] = v;
        lastLocalEditMs = nowMs();
        scheduleFlush(HEAVY_RELEASE_FLUSH_DELAY_MS);
        renderScreen();
      };

      wrap.appendChild(slider);
      return { wrap, slider };
    }

    function setControlValue(id, value) {
      const bindings = controlBindings.get(Number(id));
      const param = paramById.get(Number(id));
      const next = clampByParamId(id, value);
      if (!bindings || bindings.length === 0) {
        return;
      }
      for (const binding of bindings) {
        if (binding.type === "switch") {
          const on = next >= 64;
          binding.sw.className = "switch" + (on ? " on" : "");
          binding.note.textContent = on ? "enabled" : "disabled";
          binding.valueEl.textContent = formatParamValue(param, next);
          continue;
        }
        if (binding.type === "toggle") {
          for (const btn of binding.buttons) {
            btn.classList.toggle("active", Number(btn.dataset.value) === next);
          }
          binding.valueEl.textContent = formatParamValue(param, next);
          continue;
        }
        if (binding.type === "slider") {
          binding.slider.value = String(next);
          setSliderFill(binding.slider, next);
          binding.valueEl.textContent = formatParamValue(param, next);
          continue;
        }
        binding.knob.value = String(next);
        setKnobAngle(binding.knob, next);
        binding.valueEl.textContent = formatParamValue(param, next);
        if (Number.isFinite(binding.forceFilterMode)) {
          const modeParam = paramByName.get("filter_mode");
          const modeValue = modeParam ? clampParamValue(modeParam, state[modeParam.id]) : 0;
          const isActive = modeValue === binding.forceFilterMode;
          binding.wrap.classList.toggle("inactive", !isActive);
        }
      }
      if (param && param.name === "filter_mode") {
        const cutoffParam = paramByName.get("filter_cutoff");
        if (cutoffParam) {
          const cutoffValue = (state[cutoffParam.id] !== undefined) ? state[cutoffParam.id] : cutoffParam.default;
          setControlValue(cutoffParam.id, cutoffValue);
        }
      }
      scheduleVisualizerDraw();
    }

    function registerControlBinding(paramId, binding) {
      const id = Number(paramId);
      const existing = controlBindings.get(id);
      if (existing) {
        existing.push(binding);
      } else {
        controlBindings.set(id, [binding]);
      }
    }

    function controlKey(param) {
      if (!param) {
        return "";
      }
      if (param.virtualId) {
        return String(param.virtualId);
      }
      if (param.name) {
        return String(param.name);
      }
      return "";
    }

    function createDisplayParams(page, params) {
      if (page !== "filter") {
        let result = params.slice();
        if (uiMode === "simple") {
          const visible = SIMPLE_VISIBLE_CONTROLS[page];
          if (Array.isArray(visible)) {
            const visibleSet = new Set(visible);
            result = result.filter((p) => visibleSet.has(controlKey(p)));
            const order = new Map(visible.map((key, index) => [key, index]));
            result.sort((a, b) => {
              const ai = order.has(controlKey(a)) ? order.get(controlKey(a)) : 999;
              const bi = order.has(controlKey(b)) ? order.get(controlKey(b)) : 999;
              return Number(ai) - Number(bi);
            });
          }
          result = result.map((p) => {
            const override = SIMPLE_LABEL_OVERRIDES[controlKey(p)];
            return override ? { ...p, uiLabel: override } : p;
          });
        }
        return result;
      }
      const result = [];
      const cutoffParam = params.find((p) => p.name === "filter_cutoff");
      if (cutoffParam) {
        for (const virtual of FILTER_VIRTUAL_CONTROLS) {
          result.push({
            ...cutoffParam,
            virtualId: virtual.id,
            virtualSourceId: cutoffParam.id,
            name: virtual.id,
            uiLabel: virtual.label,
            uiGuide: virtual.guide,
            uiControl: "knob",
            forceFilterMode: virtual.forceFilterMode
          });
        }
      }
      for (const param of params) {
        if (param.name === "filter_cutoff") {
          continue;
        }
        result.push(param);
      }
      if (uiMode === "simple") {
        const visible = SIMPLE_VISIBLE_CONTROLS[page];
        if (Array.isArray(visible)) {
          const visibleSet = new Set(visible);
          for (let i = result.length - 1; i >= 0; --i) {
            if (!visibleSet.has(controlKey(result[i]))) {
              result.splice(i, 1);
            }
          }
          const order = new Map(visible.map((key, index) => [key, index]));
          result.sort((a, b) => {
            const ai = order.has(controlKey(a)) ? order.get(controlKey(a)) : 999;
            const bi = order.has(controlKey(b)) ? order.get(controlKey(b)) : 999;
            return Number(ai) - Number(bi);
          });
        }
        for (let i = 0; i < result.length; ++i) {
          const override = SIMPLE_LABEL_OVERRIDES[controlKey(result[i])];
          if (override) {
            result[i] = { ...result[i], uiLabel: override };
          }
        }
      }
      return result;
    }

    function createSectionChain(page) {
      let labels = null;
      if (page === "osc") {
        labels = ["OSC1", "OSC2", "OSC3", "OSC4"];
      } else if (page === "filter") {
        labels = ["HP", "LP", "RES"];
      } else if (page === "fx") {
        labels = ["CHORUS", "DELAY", "REVERB"];
      } else if (page === "env") {
        labels = ["EG", "AMP", "OUT"];
      }
      if (!labels) {
        return null;
      }
      const chain = document.createElement("div");
      chain.className = "section-chain mono";
      for (let i = 0; i < labels.length; ++i) {
        const node = document.createElement("span");
        node.className = "chain-node";
        node.textContent = labels[i];
        chain.appendChild(node);
        if (i < labels.length - 1) {
          const link = document.createElement("span");
          link.className = "chain-link";
          chain.appendChild(link);
        }
      }
      return chain;
    }

    function createOscillatorControls(pageParams) {
      const controls = document.createElement("div");
      controls.className = "section-controls osc-groups";
      const pageParamByName = new Map();
      for (const param of pageParams) {
        if (param && param.name) {
          pageParamByName.set(param.name, param);
        }
      }

      const firstParamFromList = (names) => {
        for (const name of names) {
          const hit = pageParamByName.get(name);
          if (hit) {
            return hit;
          }
        }
        return null;
      };

      const groups = [
        {
          title: "OSC1",
          controls: [
            { names: ["osc1_shape", "osc1_wave"], label: "Wave Type", guide: "Wave family for oscillator 1." },
            { names: ["osc1_freq", "osc_drift"], label: "Frequency", guide: "Coarse frequency for oscillator 1." },
            { names: ["osc1_morph"], label: "Pulse Width", guide: "Pulse width / wave morph amount for oscillator 1." },
            { names: ["osc2_detune"], label: "Fine", guide: "Fine detune amount around oscillator 1 frequency center." },
            { names: ["sub_noise_mix"], label: "Sub/Noise", guide: "Blend sub oscillator and noise into oscillator 1 tone." },
            { names: ["osc_drift"], label: "Drift", guide: "Global oscillator drift around center tuning." },
            { names: ["portamento"], label: "Glide", guide: "Portamento time between notes." },
            { names: ["osc1_level"], label: "Level", guide: "Oscillator 1 mixer level." }
          ]
        },
        {
          title: "OSC2",
          controls: [
            { names: ["osc2_wave"], label: "Wave Type", guide: "Wave family for oscillator 2." },
            { names: ["osc2_coarse"], label: "Frequency", guide: "Coarse frequency for oscillator 2." },
            { names: ["osc2_level"], label: "Level", guide: "Oscillator 2 mixer level." }
          ]
        },
        {
          title: "OSC3",
          controls: [
            { names: ["osc3_wave"], label: "Wave Type", guide: "Wave family for oscillator 3." },
            { names: ["osc3_freq", "osc2_detune"], label: "Frequency", guide: "Coarse frequency for oscillator 3." },
            { names: ["osc3_level"], label: "Level", guide: "Oscillator 3 mixer level." }
          ]
        },
        {
          title: "OSC4",
          controls: [
            { names: ["osc4_wave"], label: "Wave Type", guide: "Wave family for oscillator 4." },
            { names: ["osc4_freq", "osc2_detune"], label: "Frequency", guide: "Coarse frequency for oscillator 4." },
            { names: ["osc4_level"], label: "Level", guide: "Oscillator 4 mixer level." }
          ]
        }
      ];

      for (const groupDef of groups) {
        const group = document.createElement("article");
        group.className = "osc-group";
        if (groupDef.title === "OSC1") {
          group.classList.add("osc1-layout");
        }
        const head = document.createElement("div");
        head.className = "osc-group-head";
        const title = document.createElement("h3");
        title.className = "osc-group-title";
        title.textContent = groupDef.title;
        const metaTag = document.createElement("span");
        metaTag.className = "osc-group-meta mono";
        metaTag.textContent = "Wave / Freq / Level";
        head.append(title, metaTag);
        group.appendChild(head);

        const groupControls = document.createElement("div");
        groupControls.className = "osc-group-controls";
        for (const controlDef of groupDef.controls) {
          const param = firstParamFromList(controlDef.names);
          if (!param) {
            continue;
          }
          const card = createControlCard({ ...param, uiLabel: controlDef.label, uiGuide: controlDef.guide });
          card.classList.add("osc-card");
          groupControls.appendChild(card);
        }
        if (groupControls.children.length === 0) {
          const empty = document.createElement("div");
          empty.className = "section-empty mono";
          empty.textContent = "No mapped controls";
          groupControls.appendChild(empty);
        }
        group.appendChild(groupControls);
        controls.appendChild(group);
      }

      if (uiMode !== "simple") {
        const extras = document.createElement("div");
        extras.className = "osc-extras";
        const extraNames = ["osc_mix"];
        for (const name of extraNames) {
          const param = pageParamByName.get(name);
          if (!param) {
            continue;
          }
          extras.appendChild(createControlCard(param));
        }
        if (extras.children.length > 0) {
          controls.appendChild(extras);
        }
      }

      return controls;
    }

    function createControlCard(param) {
      const card = document.createElement("article");
      card.className = "card";

      const spec = uiSpecForParam(param);
      const label = param.uiLabel || spec.label || param.name;
      const guide = param.uiGuide || spec.guide || "";
      const controlType = param.uiControl || spec.control || "knob";

      const headEl = document.createElement("div");
      headEl.className = "card-head";
      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = label;
      const typeEl = document.createElement("div");
      typeEl.className = "ctrl-type";
      typeEl.textContent = controlType;
      headEl.append(nameEl, typeEl);

      const sourceId = Number.isFinite(param.virtualSourceId) ? Number(param.virtualSourceId) : Number(param.id);
      const sourceParam = paramById.get(sourceId) || param;
      if (sourceParam && sourceParam.name) {
        card.classList.add(`param-${String(sourceParam.name).replace(/[^a-z0-9_]/gi, "-").toLowerCase()}`);
      }
      const current = (state[sourceId] !== undefined) ? state[sourceId] : sourceParam.default;
      const normalizedCurrent = clampParamValue(sourceParam, current);
      const valueEl = document.createElement("div");
      valueEl.className = "value mono";
      valueEl.textContent = formatParamValue(sourceParam, normalizedCurrent);
      const guideEl = document.createElement("div");
      guideEl.className = "guide";
      guideEl.textContent = guide;

      if (controlType === "switch") {
        const ctrl = createSwitchControl(sourceParam, normalizedCurrent);
        registerControlBinding(sourceId, { type: "switch", sw: ctrl.sw, note: ctrl.note, valueEl });
        card.append(headEl, ctrl.wrap, guideEl, valueEl);
        return card;
      }

      if (controlType === "toggle") {
        const ctrl = createToggleControl(sourceParam, normalizedCurrent, spec, valueEl);
        registerControlBinding(sourceId, { type: "toggle", buttons: ctrl.buttons, options: ctrl.options, valueEl });
        card.append(headEl, ctrl.wrap, guideEl, valueEl);
        return card;
      }

      if (controlType === "slider") {
        const ctrl = createSliderControl(sourceParam, normalizedCurrent, valueEl, { heavyParam: isHeavyParam(sourceParam) });
        registerControlBinding(sourceId, { type: "slider", slider: ctrl.slider, valueEl });
        card.append(headEl, ctrl.wrap, guideEl, valueEl);
        return card;
      }

      const forceFilterMode = Number.isFinite(param.forceFilterMode) ? Number(param.forceFilterMode) : null;
      const ctrl = createKnobControl(
        sourceParam,
        normalizedCurrent,
        valueEl,
        { ...spec, control: controlType },
        { forceFilterMode, heavyParam: isHeavyParam(sourceParam) }
      );
      if (forceFilterMode !== null) {
        const modeParam = paramByName.get("filter_mode");
        const currentMode = modeParam ? clampParamValue(modeParam, state[modeParam.id]) : 0;
        ctrl.wrap.classList.toggle("inactive", currentMode !== forceFilterMode);
      }
      registerControlBinding(sourceId, { type: "knob", knob: ctrl.knob, valueEl, wrap: ctrl.wrap, forceFilterMode });
      card.append(headEl, ctrl.wrap, guideEl, valueEl);
      return card;
    }

    function createVisualizerCard(kind) {
      const card = document.createElement("article");
      card.className = "card viz-card";

      const head = document.createElement("div");
      head.className = "card-head";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = (kind === "env") ? "Envelope View" : "Filter View";

      const type = document.createElement("div");
      type.className = "ctrl-type mono";
      type.textContent = "viz";
      head.append(name, type);

      const frame = document.createElement("div");
      frame.className = "viz-frame";
      const canvas = document.createElement("canvas");
      canvas.className = "viz-canvas";
      frame.appendChild(canvas);

      const caption = document.createElement("div");
      caption.className = "viz-caption";
      caption.textContent = (kind === "env")
        ? "ADSR contour preview from current envelope settings."
        : "Frequency response preview from cutoff, resonance, and mode.";

      if (kind === "env") {
        envVizCanvas = canvas;
      } else if (kind === "filter") {
        filterVizCanvas = canvas;
      }

      card.append(head, frame, caption);
      return card;
    }

    function resolvePanelPages() {
      if (!meta || !Array.isArray(meta.params)) {
        return [];
      }
      const pagesFromParams = new Set(meta.params.map((p) => p.page).filter(Boolean));
      const pagesFromMeta = Array.isArray(meta.pages) ? meta.pages : [];
      const seen = new Set();
      const pages = [];
      for (const page of PANEL_SECTION_ORDER) {
        if (!pagesFromParams.has(page) && !pagesFromMeta.includes(page)) {
          continue;
        }
        if (!seen.has(page)) {
          pages.push(page);
          seen.add(page);
        }
      }
      for (const page of pagesFromMeta) {
        if (!seen.has(page)) {
          pages.push(page);
          seen.add(page);
        }
      }
      return pages;
    }

    function renderPanelSections() {
      panelSectionsEl.innerHTML = "";
      controlBindings.clear();
      envVizCanvas = null;
      filterVizCanvas = null;
      if (!meta || !Array.isArray(meta.params)) {
        return;
      }

      const pages = resolvePanelPages();
      for (const page of pages) {
        const sectionInfo = PANEL_SECTION_META[page] || {
          title: String(page || "Section"),
          subtitle: "Parameter group"
        };
        const section = document.createElement("section");
        section.className = `synth-section section-${String(page).toLowerCase()}`;

        const head = document.createElement("header");
        head.className = "section-head";
        const titleWrap = document.createElement("div");
        const title = document.createElement("h2");
        title.className = "section-title";
        title.textContent = sectionInfo.title;
        const subtitle = document.createElement("p");
        subtitle.className = "section-subtitle";
        subtitle.textContent = sectionInfo.subtitle;
        titleWrap.append(title, subtitle);
        const modeTag = document.createElement("span");
        modeTag.className = "section-mode mono";
        modeTag.textContent = uiMode === "simple" ? "Simple" : "Advanced";
        head.append(titleWrap, modeTag);
        section.appendChild(head);

        const chain = createSectionChain(page);
        if (chain) {
          section.appendChild(chain);
        }

        const pageParams = meta.params.filter((p) => p.page === page);
        if (page === "osc") {
          section.appendChild(createOscillatorControls(pageParams));
        } else {
          const controls = document.createElement("div");
          controls.className = "section-controls";
          const displayParams = createDisplayParams(page, pageParams);
          if (displayParams.length === 0) {
            const empty = document.createElement("div");
            empty.className = "section-empty mono";
            empty.textContent = "No mapped controls";
            controls.appendChild(empty);
          } else {
            for (const param of displayParams) {
              controls.appendChild(createControlCard(param));
            }
          }
          if (page === "env") {
            controls.appendChild(createVisualizerCard("env"));
          } else if (page === "filter") {
            controls.appendChild(createVisualizerCard("filter"));
          }
          section.appendChild(controls);
        }
        panelSectionsEl.appendChild(section);
      }
      scheduleVisualizerDraw();
    }

    function applyState(values) {
      if (!values || typeof values !== "object") {
        return;
      }
      let anyChange = false;
      for (const id of Object.keys(values)) {
        const idx = Number(id);
        const next = clampByParamId(idx, Number(values[id]));
        if (state[idx] === next) {
          continue;
        }
        state[idx] = next;
        if (dspEngine) {
          dspEngine.applyParam(idx, next);
        }
        setControlValue(idx, next);
        anyChange = true;
      }
      if (controlBindings.size === 0 && meta) {
        renderPanelSections();
        anyChange = true;
      }
      if (anyChange) {
        renderScreen();
        scheduleVisualizerDraw();
      }
    }

    async function handleJson(msg) {
      if (!msg || typeof msg !== "object") {
        return;
      }
      if (msg.type === "pong" || msg.type === "ack" || msg.type === "help") {
        return;
      }
      if (msg.type === "meta" && Array.isArray(msg.params)) {
        const schema = normalizeSchema({
          pages: Array.isArray(msg.pages) ? msg.pages : [],
          params: msg.params
        });
        meta = schema;
        rebuildParamIndex();
        if (!state || Object.keys(state).length === 0) {
          state = seedLocalDefaults();
        }
        renderPanelSections();
        renderScreen();
        return;
      }
      if (msg.type === "state" && msg.values && typeof msg.values === "object") {
        applyState(msg.values);
        return;
      }
      if (msg.type === "stats") {
        updateStatsView(msg);
        renderScreen();
        return;
      }
      if (msg.type === "error") {
        pushLog("FW ERROR " + (msg.message || "unknown"), true);
      }
    }

    async function handleLine(line) {
      if (!line) {
        return;
      }
      rxCount += 1;
      updateIoInfo();
      pushLog("RX " + line);
      try {
        const msg = JSON.parse(line);
        await handleJson(msg);
      } catch {
        pushLog("RX NON-JSON", true);
      }
    }

    async function readLoop() {
      readLoopRunning = true;
      try {
        while (readLoopRunning && reader) {
          const { value, done } = await reader.read();
          if (done) {
            break;
          }
          rxText += decoder.decode(value, { stream: true });
          let idx = rxText.indexOf("\n");
          while (idx >= 0) {
            const line = rxText.slice(0, idx).replace(/\r/g, "").trim();
            rxText = rxText.slice(idx + 1);
            await handleLine(line);
            idx = rxText.indexOf("\n");
          }
        }
      } catch (err) {
        pushLog("READ ERROR " + err.message, true);
      } finally {
        readLoopRunning = false;
      }
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(() => queueLine("PING"), 1500);
      statsTimer = setInterval(() => queueLine("STATS"), 1000);
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
      if (statsTimer) {
        clearInterval(statsTimer);
        statsTimer = null;
      }
      if (flushTimer) {
        clearTimeout(flushTimer);
        flushTimer = null;
      }
    }

    async function connect() {
      if (connectInProgress) {
        return;
      }

      connectInProgress = true;
      setConnectedUi(false);
      setStatus("Connecting...", false);
      try {
        if (transportMode === "emulator") {
          await connectEmulator();
          return;
        }
        if (!("serial" in navigator)) {
          setStatus("Web Serial unsupported", false);
          return;
        }
        port = await navigator.serial.requestPort();

        let opened = false;
        let lastErr = null;
        for (let attempt = 0; attempt < 10 && !opened; ++attempt) {
          try {
            await port.open({ baudRate: 115200 });
            opened = true;
          } catch (err) {
            lastErr = err;
            await new Promise((resolve) => setTimeout(resolve, 250));
          }
        }
        if (!opened) {
          throw lastErr || new Error("Failed to open serial port");
        }

        setPortInfo();
        writer = port.writable.getWriter();
        reader = port.readable.getReader();
        meta = LOCAL_SCHEMA;
        rebuildParamIndex();
        state = seedLocalDefaults();
        renderPanelSections();
        renderScreen();

        setConnectedUi(true);
        setStatus("Connected", true);
        pushLog("CONNECTED", true);
        startPolling();
        readLoop().catch(() => {});
        queueLine("PING");
        queueLine("STATS");
      } finally {
        connectInProgress = false;
        setConnectedUi(Boolean((transportMode === "emulator" && emulator && emulator.connected) || (port && writer && reader)));
      }
    }

    async function disconnect() {
      releaseAllHeldNotes();
      stopPolling();
      txQueue = [];
      txBusy = false;
      pending = {};
      readLoopRunning = false;
      if (emulator && emulator.connected) {
        emulator.connected = false;
      }
      if (dspEngine) {
        await dspEngine.stop();
        dspEngine = null;
      }

      try {
        if (reader) {
          await reader.cancel();
          reader.releaseLock();
        }
      } catch {}

      try {
        if (writer) {
          writer.releaseLock();
        }
      } catch {}

      try {
        if (port) {
          await port.close();
        }
      } catch {}

      reader = null;
      writer = null;
      port = null;
      rxText = "";

      setConnectedUi(false);
      setStatus(transportMode === "emulator" ? "Emulator Ready" : "Disconnected", false);
      refreshTransportUi();
      pushLog("DISCONNECTED", true);
    }

    function shouldIgnoreComputerKeyboardTarget(target) {
      if (!target || !(target instanceof Element)) {
        return false;
      }
      const tag = target.tagName;
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON";
    }

    function onComputerKeyDown(ev) {
      if (shouldIgnoreComputerKeyboardTarget(ev.target)) {
        return;
      }
      const semitoneOffset = KEYBOARD_PC_MAP[ev.code];
      if (semitoneOffset === undefined) {
        return;
      }
      ev.preventDefault();
      if (ev.repeat || keyboardCodeToNote.has(ev.code)) {
        return;
      }
      const note = clampMidi7(keyboardStartNote() + semitoneOffset);
      keyboardCodeToNote.set(ev.code, note);
      noteAcquire(note, keyboardVelocity());
    }

    function onComputerKeyUp(ev) {
      const note = keyboardCodeToNote.get(ev.code);
      if (note === undefined) {
        return;
      }
      ev.preventDefault();
      keyboardCodeToNote.delete(ev.code);
      noteRelease(note);
    }

    connectBtn.onclick = () => connect().catch((err) => {
      setStatus("Connect failed", false);
      pushLog("CONNECT ERROR " + err.message, true);
      void disconnect();
    });
    disconnectBtn.onclick = () => void disconnect();
    transportBtn.onclick = () => void setTransportMode(transportMode === "serial" ? "emulator" : "serial");
    uiModeBtn.onclick = () => setUiMode(uiMode === "simple" ? "advanced" : "simple");
    metaBtn.onclick = () => {
      meta = LOCAL_SCHEMA;
      rebuildParamIndex();
      renderPanelSections();
      renderScreen();
    };
    stateBtn.onclick = () => pushAllCurrentState();
    statsBtn.onclick = () => queueLine("STATS");
    kbPanicBtn.onclick = () => releaseAllHeldNotes();
    kbStartOctEl.addEventListener("change", () => renderKeyboard());
    kbVelocityEl.addEventListener("input", () => renderKeyboard());
    kbChordModeEl.addEventListener("change", () => {
      releaseAllHeldNotes();
      renderKeyboard();
    });
    kbChordRootEl.addEventListener("change", () => {
      releaseAllHeldNotes();
      renderKeyboard();
    });
    kbChordOctEl.addEventListener("change", () => {
      releaseAllHeldNotes();
      renderKeyboard();
    });
    kbChordTypeEl.addEventListener("change", () => {
      releaseAllHeldNotes();
      renderKeyboard();
    });

    if ("serial" in navigator && navigator.serial.addEventListener) {
      navigator.serial.addEventListener("disconnect", async () => {
        if (port) {
          pushLog("USB DEVICE DETACHED", true);
          await disconnect();
        }
      });
    }

    window.addEventListener("keydown", onComputerKeyDown);
    window.addEventListener("keyup", onComputerKeyUp);
    window.addEventListener("resize", scheduleVisualizerDraw);
    setUiMode("simple");
    refreshTransportUi();
    setConnectedUi(false);
    setStatus(transportMode === "emulator" ? "Emulator Ready" : "Disconnected", false);
    updateIoInfo();
    renderKeyboard();
    renderScreen();
  </script>
</body>
</html>
